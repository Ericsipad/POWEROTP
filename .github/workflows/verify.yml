name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production build, types, and tests
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Redeploys apps/telephony-agent on the Asterisk droplet after every push
  # to main, only once `verify` has passed — the droplet has no App
  # Platform-style webhook of its own, so this replicates that same
  # "push to main -> live" behavior for it via SSH. See
  # infrastructure/asterisk/README.md for the equivalent manual steps this
  # mirrors, and docs/AS_BUILT.md's "Telephony droplet" section for why a
  # droplet is never individually configured beyond CONTROL_PLANE_URL/
  # NODE_SECRET — this job only ever pushes code, never any secret.
  #
  # The whole deploy is one `ssh` with the tarball on stdin, because
  # DROPLET_SSH_KEY is pinned on the droplet to the single forced command
  # `/usr/local/bin/potp-deploy` (infrastructure/asterisk/potp-deploy). That
  # key cannot open a shell, run any other command, or read
  # /etc/powerotp/*.env, and it authenticates as the unprivileged
  # `potp-deploy` user rather than root — so `npm ci`'s postinstall scripts
  # no longer execute as root on the node. Do not reintroduce a separate
  # `scp` step or an inline command list here; both require an unrestricted
  # key. See docs/AS_BUILT.md's "Droplet deploy hardening" section.
  deploy-droplet:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build deployment archive
        run: git archive --format=tar.gz -o /tmp/powerotp-deploy.tar.gz HEAD

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/droplet_key
          chmod 600 ~/.ssh/droplet_key
          # A pinned host key, not ssh-keyscan: trust-on-first-use from a
          # public runner would accept a MITM'd host key on every run, which
          # made the StrictHostKeyChecking=yes below decorative.
          printf '%s\n' "${{ secrets.DROPLET_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy the agent
        run: |
          ssh -i ~/.ssh/droplet_key -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.DROPLET_SSH_USER }}@${{ secrets.DROPLET_HOST }}" \
            < /tmp/powerotp-deploy.tar.gz

name: powerotp
region: nyc

# Environment variables are set once at the app level in DigitalOcean's UI
# (App Platform -> Settings -> App-Level Environment Variables), not per
# component. This list documents what must exist there; App Platform does
# not auto-sync it from the repo, so update both places when adding one.
envs:
  - key: MONGODB_URI
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: VALKEY_URL
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: INTERACTION_TOKEN_SECRET
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: CONFIG_ENCRYPTION_KEY
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: SESSION_HASH_SECRET
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: API_KEY_HASH_SECRET
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: BREVO_API_KEY
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: EMAIL_FROM
    scope: RUN_TIME
    value: login@powerotp.com
  # Single app, single origin: web, /v1 API, and /mcp are all served by
  # the same process on the same domain — there are no app./api. subdomains.
  - key: PUBLIC_APP_URL
    scope: RUN_TIME
    value: https://powerotp.com
  - key: PUBLIC_API_URL
    scope: RUN_TIME
    value: https://powerotp.com
  - key: DEMO_PROJECT_SLUG
    scope: RUN_TIME
    value: demo
  # VoIP.ms trunk credentials, one dedicated outbound per verification
  # method (never shared) so a limit, suspension, or compromise on one
  # method's trunk cannot affect the others. OUTBOUND1=call_reachability,
  # OUTBOUND2=voice_code, OUTBOUND3=voice_challenge, OUTBOUND4=sms_code.
  # Leave unset until Phase 4 telephony wiring; the app starts fine
  # without them.
  - key: OUTBOUND1_URL
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: OUTBOUND1_USER
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: OUTBOUND1_PASS
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: OUTBOUND2_URL
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: OUTBOUND2_USER
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: OUTBOUND2_PASS
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: OUTBOUND3_URL
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: OUTBOUND3_USER
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: OUTBOUND3_PASS
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: OUTBOUND4_URL
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: OUTBOUND4_USER
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM
  - key: OUTBOUND4_PASS
    scope: RUN_TIME
    type: SECRET
    value: SET_IN_APP_PLATFORM

# One component, one normal Next.js app. Everything (marketing/dashboard
# site, the /v1 customer and verification API with its durable background
# workers, and the public /mcp integration guide) is served by Next.js
# Route Handlers in apps/web, with the API/queue logic imported as a
# library from apps/api. Build and start are exactly what every other app
# here uses — no custom server, no ingress rules to keep in sync.
services:
  - name: app
    github:
      repo: Ericsipad/POWEROTP
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm run start -w @powerotp/web -- -p $PORT
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health

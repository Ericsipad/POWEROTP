name: powerotp
region: nyc

services:
  - name: web
    github:
      repo: Ericsipad/POWEROTP
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build -w @powerotp/contracts && npm run build -w @powerotp/web
    run_command: npm run start -w @powerotp/web -- -p $PORT
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
  - name: api
    github:
      repo: Ericsipad/POWEROTP
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build -w @powerotp/contracts && npm run build -w @powerotp/api
    run_command: npm run start -w @powerotp/api
    http_port: 3001
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
    envs:
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
        value: SET_IN_APP_PLATFORM
      - key: VALKEY_URL
        scope: RUN_TIME
        type: SECRET
        value: SET_IN_APP_PLATFORM
      - key: INTERACTION_TOKEN_SECRET
        scope: RUN_TIME
        type: SECRET
        value: SET_IN_APP_PLATFORM
      - key: CONFIG_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: SET_IN_APP_PLATFORM
      - key: SESSION_HASH_SECRET
        scope: RUN_TIME
        type: SECRET
        value: SET_IN_APP_PLATFORM
      - key: API_KEY_HASH_SECRET
        scope: RUN_TIME
        type: SECRET
        value: SET_IN_APP_PLATFORM
      - key: BREVO_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: SET_IN_APP_PLATFORM
      - key: EMAIL_FROM
        scope: RUN_TIME
        value: login@powerotp.com
      - key: PUBLIC_APP_URL
        scope: RUN_TIME
        value: https://app.powerotp.com
      - key: PUBLIC_API_URL
        scope: RUN_TIME
        value: https://api.powerotp.com

  - name: mcp
    github:
      repo: Ericsipad/POWEROTP
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build -w @powerotp/contracts && npm run build -w @powerotp/mcp
    run_command: npm run start -w @powerotp/mcp
    http_port: 3002
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
workers:
  - name: worker
    github:
      repo: Ericsipad/POWEROTP
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build -w @powerotp/worker
    run_command: npm run start -w @powerotp/worker
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
        value: SET_IN_APP_PLATFORM
      - key: VALKEY_URL
        scope: RUN_TIME
        type: SECRET
        value: SET_IN_APP_PLATFORM

ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /v1
    - component:
        name: mcp
      match:
        path:
          prefix: /mcp
    - component:
        name: web
      match:
        path:
          prefix: /

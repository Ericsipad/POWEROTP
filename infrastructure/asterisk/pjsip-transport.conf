; Append to /etc/asterisk/pjsip.conf on any new droplet (before or after the
; #include pjsip_trunks.conf line - order doesn't matter). Every transport in
; the Debian/Ubuntu packaged sample pjsip.conf ships commented out; with zero
; active transports, res_pjsip_outbound_registration silently fails to create
; ANY registration object, with only a generic error in
; /var/log/asterisk/messages.log:
;
;   res_sorcery_config.c: Could not create an object of type 'registration'
;   with id '...' from configuration file 'pjsip.conf'
;
; while endpoint/aor/auth/identify objects from the same file load fine,
; which is what makes this confusing to diagnose. This is droplet-level
; infrastructure (doesn't vary per trunk), so it lives here rather than being
; rendered by apps/telephony-agent.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

# Install as /etc/ssh/sshd_config.d/10-powerotp-hardening.conf
#
# The `10-` prefix is load-bearing: sshd keeps the FIRST value it sees for each
# keyword, and DigitalOcean's base image ships `50-cloud-init.conf` and
# `60-cloudimg-settings.conf`. A `99-` file would silently lose to them.
#
# Human access is `opsadmin` (passwordless sudo, key-only). CI is `potp-deploy`,
# whose key is pinned to the single forced command /usr/local/bin/potp-deploy
# (see potp-deploy in this directory). Nothing needs to log in as root, so root
# login is closed outright rather than left at `prohibit-password`.
#
# BEFORE reloading sshd with this in place, confirm `opsadmin` can log in AND
# sudo. Getting this wrong locks you out of the droplet entirely.
PermitRootLogin no
AllowUsers opsadmin potp-deploy

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

MaxAuthTries 3
LoginGraceTime 20

AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
X11Forwarding no

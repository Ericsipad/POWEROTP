; Install at /etc/systemd/system/asterisk.service.d/override.conf on the droplet,
; then `systemctl daemon-reload && systemctl restart asterisk`.
;
; Asterisk's packaged unit doesn't reliably honor asterisk.conf's
; astctlpermissions/astctlgroup settings on this build, so the control socket
; (/var/run/asterisk/asterisk.ctl) comes back owner-only-write on every restart,
; which blocks the non-root potp-agent service account (group `asterisk`) from
; issuing commands like `pjsip reload`. This is the exact drop-in mechanism the
; packaged unit's own comments recommend, not a one-off chmod that the next
; restart would silently undo. It reliably runs after the socket exists because
; the unit is Type=notify: systemd waits for Asterisk's ready notification, which
; comes after socket creation, before running ExecStartPost.

[Service]
ExecStartPost=/bin/chmod 660 /var/run/asterisk/asterisk.ctl
